<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1424">
<title>奇妙考察隊 · 四上人文課1–4</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hud">
  <div id="missionPill" class="pill" data-testid="mission-pill">🗺️ 準備出發</div>
  <div id="stats" class="pill right" data-testid="stats">⭐ 0 · ⏱ --</div>
  <div id="progress" data-testid="progress"></div>
  <div id="hint" data-testid="hint"></div>
  <div id="held" data-testid="held"></div>
  <div id="prompt" data-testid="prompt"></div>
  <div id="cross"></div>
  <button id="act" data-testid="act" aria-label="行動">✋</button>
  <div id="joy" data-testid="joy"><div id="knob"></div></div>
  <div id="toast" data-testid="toast"></div>
  <div id="boardHost" data-testid="board-host"></div>
</div>

<div id="title" class="ov title" data-testid="title">
  <div class="card">
    <div class="badge">四上人文 · 課 1–4</div>
    <h1>奇妙考察隊</h1>
    <div class="lessons">
      <span style="--c:#2f80ed">🗺️ 小小考察隊</span>
      <span style="--c:#27ae60">⛰️ 漫遊香港</span>
      <span style="--c:#f2994a">🌦️ 香港的氣候</span>
      <span style="--c:#9b51e0">🌍 發現地球</span>
    </div>
    <div class="howto">
      <div><b>🕹️</b><span>移動</span></div>
      <div><b>👆</b><span>望</span></div>
      <div><b>✋</b><span>互動</span></div>
      <div><b>🏅</b><span>12 任務</span></div>
    </div>
    <button class="btn loading" id="go" data-testid="start" disabled>▶ 開始考察</button>
  </div>
</div>

<div id="end" class="ov hide" data-testid="end">
  <div class="card">
    <div class="badge">考察完成</div>
    <div id="endStars" class="stars"></div>
    <div id="endScore" class="score"></div>
    <div id="endDone" class="sub"></div>
    <div class="lessons">
      <span style="--c:#2f80ed">🗺️ 小小考察隊</span>
      <span style="--c:#27ae60">⛰️ 漫遊香港</span>
      <span style="--c:#f2994a">🌦️ 香港的氣候</span>
      <span style="--c:#9b51e0">🌍 發現地球</span>
    </div>
    <button class="btn" id="replay">🔁 再玩</button>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="js/game.js"></script>
</body>
</html>
